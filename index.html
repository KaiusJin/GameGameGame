<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>系统</title>
    <script src="js/mobile.js?v=11"></script>
    <link rel="stylesheet" href="css/pc.css?v=11">
    <link rel="stylesheet" href="css/apps.css?v=11">
    <link rel="stylesheet" href="css/browser.css?v=11">
    <link rel="stylesheet" href="css/system.css?v=12">
    <link rel="stylesheet" href="css/virus.css?v=11">
    <link rel="stylesheet" href="css/xhs.css?v=12">
</head>
<body>

    <!-- 开机序列 -->
    <div id="boot-overlay">
        <div id="boot-lines"></div>
    </div>

    <!-- 监控条（接入目标设备时出现） -->
    <div id="monitor-bar" hidden>
        <span class="mb-dot"></span>
        <b data-t="virus.monitor.bar"></b>
        <button id="monitor-exit" data-t="virus.exit.btn" data-hint="monitor:exit"></button>
    </div>

    <!-- 目标电脑的登录界面（黑入过场之后） -->
    <div id="login-screen" hidden>
        <div class="lg-card">
            <img id="login-ava" src="" alt="">
            <div id="login-name"></div>
            <div class="lg-row">
                <input id="login-pwd" type="password" autocomplete="off">
                <button id="login-go">→</button>
            </div>
            <div id="login-msg"></div>
            <div id="login-hint"></div>
        </div>
    </div>

    <!-- 右键菜单 -->
    <div id="ctx-menu" hidden></div>

    <div class="desktop" id="desktop">

        <!-- 桌面图标（应用） -->
        <div class="desktop-icon" id="icon-browser" data-app="browser">
            <img class="ic" src="image/chrome.png" alt="">
            <div class="label" data-t="app.browser.title"></div>
        </div>
        <div class="desktop-icon" id="icon-chat" data-app="chat">
            <img class="ic" src="image/wechat.png" alt="">
            <div class="label" data-t="app.chat.title"></div>
        </div>
        <div class="desktop-icon" id="icon-files" data-app="files">
            <img class="ic" src="image/folder.png" alt="">
            <div class="label" data-t="app.files.title"></div>
        </div>
        <div class="desktop-icon" id="icon-xhs" data-app="xhs">
            <img class="ic" src="image/xiaohongshu.png" alt="">
            <div class="label" data-t="app.xhs.title"></div>
        </div>
        <div class="desktop-icon" id="icon-mypc" data-app="mypc">
            <img class="ic" src="image/myPc.png" alt="">
            <div class="label" data-t="app.mypc.title"></div>
        </div>
        <div class="desktop-icon" id="icon-recycle" data-app="recycle">
            <img class="ic" src="image/recycleEmpty.png" alt="">
            <div class="label" data-t="app.recycle.title"></div>
        </div>
        <!-- 桌面文件图标（files.js 渲染：前任机主的 txt 链等） -->
        <div id="desktop-files"></div>

        <!-- 病毒软件（txt 链读完才"出现"） -->
        <div class="desktop-icon" id="icon-virus" data-app="virus">
            <svg class="ic" viewBox="0 0 48 48"><rect x="3" y="3" width="42" height="42" rx="6" fill="#050b06" stroke="#1c4a26"/><text x="24" y="31" text-anchor="middle" font-family="monospace" font-size="19" fill="#39ff6e">&gt;_</text></svg>
            <div class="label" data-t="app.virus.title"></div>
        </div>


        <!-- 窗口：此电脑 -->
        <div class="window" id="win-mypc" data-app="mypc" style="width:640px;height:420px;">
            <div class="title-bar">
                <div class="title-text"><img src="image/myPc.png" alt=""><span data-t="app.mypc.title"></span></div>
                <div class="window-controls">
                    <button class="btn-min">─</button><button class="btn-max">▢</button><button class="btn-close">✕</button>
                </div>
            </div>
            <div class="window-content">
                <div class="plain-pane">
                    <p style="color:#888;margin-bottom:14px;" data-t="mypc.drives"></p>
                    <div class="drive">
                        <svg width="40" height="40" viewBox="0 0 48 48"><rect x="6" y="14" width="36" height="20" rx="2" fill="#d9e4ee" stroke="#9fb3c2"/><circle cx="37" cy="24" r="2" fill="#6ee06e"/></svg>
                        <div>
                            本地磁盘 (C:)
                            <div class="bar"><i style="width:62%"></i></div>
                            <small>93.1 GB 可用，共 237 GB</small>
                        </div>
                    </div>
                    <div class="drive">
                        <svg width="40" height="40" viewBox="0 0 48 48"><rect x="6" y="14" width="36" height="20" rx="2" fill="#d9e4ee" stroke="#9fb3c2"/><circle cx="37" cy="24" r="2" fill="#6ee06e"/></svg>
                        <div>
                            本地磁盘 (D:)
                            <div class="bar"><i style="width:18%"></i></div>
                            <small>391 GB 可用，共 476 GB</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 窗口：回收站 -->
        <div class="window" id="win-recycle" data-app="recycle" style="width:560px;height:380px;">
            <div class="title-bar">
                <div class="title-text"><img src="image/recycleEmpty.png" alt=""><span data-t="app.recycle.title"></span></div>
                <div class="window-controls">
                    <button class="btn-min">─</button><button class="btn-max">▢</button><button class="btn-close">✕</button>
                </div>
            </div>
            <div class="window-content">
                <div class="fx-root">
                    <div class="fx-head">
                        <span class="c-name" data-t="ui.col.name"></span><span class="c-date" data-t="ui.col.date"></span><span class="c-size" data-t="ui.col.size"></span>
                    </div>
                    <div class="fx-list" id="rc-list"></div>
                </div>
            </div>
        </div>

        <!-- 窗口：浏览器 -->
        <div class="window" id="win-browser" data-app="browser" style="width:980px;height:660px;">
            <div class="title-bar">
                <div class="title-text">
                    <img src="image/chrome.png" alt="">
                    <span id="browser-title"></span>
                </div>
                <div class="window-controls">
                    <button class="btn-min">─</button><button class="btn-max">▢</button><button class="btn-close">✕</button>
                </div>
            </div>
            <div class="window-content">
                <div class="br-root">
                    <div class="br-toolbar">
                        <div class="br-navbtn" id="br-back">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
                        </div>
                        <div class="br-navbtn enabled" id="br-refresh">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                        </div>
                        <div class="br-address" id="br-address">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                            <input autocomplete="off" spellcheck="false">
                        </div>
                    </div>
                    <div class="br-bookmarks" id="br-bookmarks"></div>
                    <div class="br-view" id="br-view"></div>
                </div>
            </div>
        </div>

        <!-- 窗口：聊天（微信壳：自己的会话 + 监控模式） -->
        <div class="window" id="win-chat" data-app="chat" style="width:1000px;height:660px;">
            <div class="title-bar">
                <div class="title-text">
                    <img src="image/wechat.png" alt="">
                    <span data-t="app.chat.title"></span>
                </div>
                <div class="window-controls">
                    <button class="btn-min">─</button><button class="btn-max">▢</button><button class="btn-close">✕</button>
                </div>
            </div>
            <div class="window-content">
                <div class="wc-root">
                    <div class="wc-nav">
                        <div class="wc-nav-ava" id="wc-my-ava"></div>
                        <div class="wc-nav-btn active">
                            <svg viewBox="0 0 1024 1024" width="22" height="22" fill="currentColor"><path d="M512 128C246.9 128 32 308.2 32 530.6c0 126.5 67.8 240 178.6 313.6-6 40.8-25.2 92.4-66 142 41.5 0 120-11.8 193.3-64.4C401.7 941.1 455.7 952 512 952c265.1 0 480-180.2 480-402.6S777.1 128 512 128z"/></svg>
                        </div>
                        <div class="wc-nav-btn dim">
                            <svg viewBox="0 0 1024 1024" width="22" height="22" fill="currentColor"><path d="M512 85.333333c235.648 0 426.666667 191.018667 426.666667 426.666667s-191.018667 426.666667-426.666667 426.666667S85.333333 747.648 85.333333 512 276.352 85.333333 512 85.333333z m0 170.666667a256 256 0 1 0 0 512 256 256 0 0 0 0-512z"/></svg>
                        </div>
                    </div>
                    <div class="wc-side">
                        <div class="wc-search"><div><svg viewBox="0 0 1024 1024" width="14" height="14" fill="#999"><path d="M909.6 854.5L649.9 594.8C690.2 542.7 712 479 712 412c0-80.2-31.3-155.6-87.9-212.1C567.5 143.3 492.2 112 412 112c-80.2 0-155.6 31.3-212.1 87.9C143.3 256.4 112 331.8 112 412c0 80.2 31.3 155.6 87.9 212.1C256.4 680.7 331.8 712 412 712c67 0 130.6-21.8 182.7-62l259.7 259.6a40.2 40.2 0 0 0 56.8-56.8zM412 640c-125.7 0-228-102.3-228-228s102.3-228 228-228 228 102.3 228 228-102.3 228-228 228z"/></svg><input id="wc-search-input" type="text" autocomplete="off"></div></div>
                        <div class="wc-search-dd" id="wc-search-dd" hidden></div>
                        <div class="wc-list" id="wc-list"></div>
                    </div>
                    <div class="wc-panel">
                        <div class="wc-panel-head" id="wc-panel-head"></div>
                        <div class="wc-panel-body" id="wc-panel-body"></div>
                        <div class="wc-panel-foot" id="wc-panel-foot" hidden>
                            <div class="wc-tools"><span id="wc-call-tool" title=""><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg></span></div>
                            <div class="wc-chips" id="wc-chips" hidden></div>
                            <textarea id="wc-input" rows="2"></textarea>
                            <div class="wc-send-row"><button id="wc-send" data-t="chat.send"></button></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 窗口：文件 -->
        <div class="window" id="win-files" data-app="files" style="width:780px;height:500px;">
            <div class="title-bar">
                <div class="title-text"><img src="image/folder.png" alt=""><span data-t="app.files.title"></span></div>
                <div class="window-controls">
                    <button class="btn-min">─</button><button class="btn-max">▢</button><button class="btn-close">✕</button>
                </div>
            </div>
            <div class="window-content">
                <div class="fx-root">
                    <div class="fx-head">
                        <span class="c-name" data-t="ui.col.name"></span><span class="c-date" data-t="ui.col.date"></span><span class="c-size" data-t="ui.col.size"></span>
                    </div>
                    <div class="fx-list" id="fx-list"></div>
                </div>
            </div>
        </div>

        <!-- 窗口：查看器（代码打开，无桌面图标） -->
        <div class="window" id="win-viewer" data-app="viewer" style="width:740px;height:620px;">
            <div class="title-bar">
                <div class="title-text"><img src="image/file.png" alt=""><span id="viewer-title"></span></div>
                <div class="window-controls">
                    <button class="btn-min">─</button><button class="btn-max">▢</button><button class="btn-close">✕</button>
                </div>
            </div>
            <div class="window-content">
                <div class="viewer-body" id="viewer-body"></div>
            </div>
        </div>

        <!-- 窗口：小红书（她的电脑上才有） -->
        <div class="window" id="win-xhs" data-app="xhs" style="width:1000px;height:680px;">
            <div class="title-bar">
                <div class="title-text"><img src="image/xiaohongshu.png" alt=""><span data-t="app.xhs.title"></span></div>
                <div class="window-controls">
                    <button class="btn-min">─</button><button class="btn-max">▢</button><button class="btn-close">✕</button>
                </div>
            </div>
            <div class="window-content">
                <div id="xhs-root"></div>
            </div>
        </div>

        <!-- 窗口：病毒软件 -->
        <div class="window vx-window" id="win-virus" data-app="virus" style="width:860px;height:600px;">
            <div class="title-bar">
                <div class="title-text">
                    <svg viewBox="0 0 48 48"><rect x="3" y="3" width="42" height="42" rx="6" fill="#050b06" stroke="#1c4a26"/><text x="24" y="31" text-anchor="middle" font-family="monospace" font-size="19" fill="#39ff6e">&gt;_</text></svg>
                    <span data-t="app.virus.title"></span>
                </div>
                <div class="window-controls">
                    <button class="btn-min">─</button><button class="btn-max">▢</button><button class="btn-close" data-hint="virus:close">✕</button>
                </div>
            </div>
            <div class="window-content">
                <div id="vx-root"></div>
            </div>
        </div>

    </div>

    <!-- 任务栏 -->
    <div class="taskbar">
        <div class="start-btn" id="start-btn">
            <svg viewBox="0 0 88 88" width="20" height="20"><path fill="#e8f2fa" d="M0,12.5 L36,7.5 L36,42 L0,42 L0,12.5 Z M39,7 L88,0 L88,42 L39,42 L39,7 Z M0,45 L36,45 L36,79.5 L0,74.5 L0,45 Z M39,45 L88,45 L88,88 L39,81 L39,45 Z"/></svg>
        </div>
        <div class="task-items" id="task-items"></div>
        <div class="task-clock" id="task-clock">
            <div id="clock-time">--:--</div>
            <div id="clock-date"></div>
        </div>
    </div>

    <!-- 开始菜单 -->
    <div class="start-menu" id="start-menu">
        <div class="sm-item" data-open="browser"><img src="image/chrome.png" alt=""><span data-t="app.browser.title"></span></div>
        <div class="sm-item" data-open="chat">
            <img src="image/wechat.png" alt="">
            <span data-t="app.chat.title"></span>
        </div>
        <div class="sm-item" data-open="files"><img src="image/folder.png" alt=""><span data-t="app.files.title"></span></div>
        <div class="sm-item" data-open="mypc"><img src="image/myPc.png" alt=""><span data-t="app.mypc.title"></span></div>
        <div class="sm-item" data-open="recycle"><img src="image/recycleEmpty.png" alt=""><span data-t="app.recycle.title"></span></div>
        <div class="sm-divider"></div>
        <div class="sm-item" id="sm-shutdown" data-show-flag="shutdown_avail" data-hint="sm:shutdown">
            <svg viewBox="0 0 24 24" fill="none" stroke="#eee" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
            <span data-t="ui.sm.shutdown"></span>
        </div>
        <div class="sm-item" id="sm-restart">
            <svg viewBox="0 0 24 24" fill="none" stroke="#eee" stroke-width="1.6" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>
            <span data-t="ui.sm.restart"></span>
        </div>
    </div>

    <script src="js/data.js?v=11"></script>
    <script src="js/engine/fx.js?v=11"></script>
    <script src="js/engine/state.js?v=11"></script>
    <script src="js/engine/notify.js?v=11"></script>
    <script src="js/engine/wm.js?v=11"></script>
    <script src="js/engine/hack.js?v=11"></script>
    <script src="js/engine/signin.js?v=11"></script>
    <script src="js/engine/call.js?v=11"></script>
    <script src="js/engine/ending.js?v=11"></script>
    <script src="js/apps/files.js?v=11"></script>
    <script src="js/apps/viewer.js?v=11"></script>
    <script src="js/apps/chat.js?v=11"></script>
    <script src="js/apps/browser.js?v=11"></script>
    <script src="js/apps/xhs.js?v=12"></script>
    <script src="js/apps/virus.js?v=11"></script>
    <script src="js/engine/boot.js?v=11"></script>
</body>
</html>
