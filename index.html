<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录</title>
    <script src="js/mobile.js"></script>
    <link rel="stylesheet" href="css/lock.css">
    <script src="js/boot-check.js"></script>
</head>
<body>

    <!-- 首次开机设置（OOBE） -->
    <div id="oobe">
        <div class="oobe-box">
            <h1>为你的设备进行设置</h1>
            <div class="oobe-item">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>
                <div><b>获取沉浸式体验</b>本作是一款解谜向的剧情游戏，建议佩戴耳机、在安静的环境下游玩，并尽量一次性玩完。</div>
            </div>
            <div class="oobe-item">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                <div><b>浏览并发现线索</b>真相往往藏在帖子、评论区和个人主页的角落里。请像平时刷手机一样，仔细看。</div>
            </div>
            <div class="oobe-item">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                <div><b>虚构声明</b>本作全部人物、账号、事件、对话均属虚构。剧情涉及留学压力与失联情节，请适度游玩。你的进度会自动保存在本地。</div>
            </div>

            <div class="oobe-name">
                <label for="oobe-input">你的名字是？</label>
                <input id="oobe-input" maxlength="14" autocomplete="off" placeholder="输入你的名字">
                <div class="hint">它会成为这台电脑的用户名，也会出现在你的社交账号上</div>
            </div>

            <div class="oobe-footer">
                <button id="oobe-accept" disabled>接 受</button>
            </div>
        </div>
    </div>

    <!-- 开机动画 -->
    <div id="boot-screen">
        <svg viewBox="0 0 88 88" width="90" height="90">
            <path fill="#0078D7" d="M0,12.5 L36,7.5 L36,42 L0,42 L0,12.5 Z M39,7 L88,0 L88,42 L39,42 L39,7 Z M0,45 L36,45 L36,79.5 L0,74.5 L0,45 Z M39,45 L88,45 L88,88 L39,81 L39,45 Z"/>
        </svg>
        <div class="win-loader">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
    </div>

    <!-- 锁屏 -->
    <div id="lockscreen">
        <div>
            <div class="lock-time" id="lock-time">00:00</div>
            <div class="lock-date" id="lock-date">加载中...</div>
        </div>
        <div class="lock-tip">点击任意地方解锁</div>
    </div>

    <!-- 登录 -->
    <div id="login-screen">
        <div class="login-avatar" id="login-avatar"></div>
        <div class="login-name" id="login-name">用户</div>
        <button id="login-btn" type="button">登 录</button>
    </div>

    <script src="js/lock.js"></script>
</body>
</html>
