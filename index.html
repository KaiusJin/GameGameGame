<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>微信</title>
    <script src="js/mobile.js"></script>
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/shot.css">
    <script src="js/boot-check.js"></script>
</head>
<body>

    <div class="wx-frame">
        <div class="wx-header">
            <span class="wx-title" id="wx-title">微信</span>
            <span class="wx-more">···</span>
        </div>
        <div class="wx-msgs" id="wx-msgs"></div>
        <div class="wx-replybar" id="wx-replybar"></div>
        <div class="wx-inputbar">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            <div class="wx-input-fake"></div>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.2 1.6 3.5 1.6 3.5-1.6 3.5-1.6"/><circle cx="9" cy="10" r=".8" fill="currentColor"/><circle cx="15" cy="10" r=".8" fill="currentColor"/></svg>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        </div>
    </div>

    <div id="connect-overlay" hidden>
        <div class="co-brand"><span class="td-logo">T</span><b>ToDask</b></div>
        <div class="co-spinner"></div>
        <div class="co-steps" id="co-steps"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/clues.js"></script>
    <script src="js/shots.js"></script>
    <script src="js/intro.js"></script>
</body>
</html>
